<template>

    <article class="slds-card slds-m-bottom_medium">

        <div class="slds-card__header slds-grid">

            <header class="slds-media slds-media_center">

                <div class="slds-media__body">

                    <h2 class="slds-card__header-title">
                        {job.Name}
                    </h2>

                </div>

            </header>

        </div>


        <div class="slds-card__body slds-card__body_inner">

            <p class="slds-m-bottom_x-small">
                <strong>Minimum CGPA:</strong>
                {job.Minimum_CGPA__c}
            </p>


            <p class="slds-m-bottom_x-small">
                <strong>Allowed Backlogs:</strong>
                {job.Allowed_Backlogs__c}
            </p>


            <p class="slds-m-bottom_x-small">
                <strong>Eligible Branches:</strong>
                {job.Eligible_Branches__c}
            </p>


            <p class="slds-m-bottom_medium">
                <strong>Closing Date:</strong>
                {job.Closing_Date__c}
            </p>


            <div class="slds-grid slds-gutters_small">

                <div>

                    <lightning-button
                        label="View Details"
                        value={job.Id}
                        onclick={handleViewDetails}>
                    </lightning-button>

                </div>


                <div>

                    <lightning-button
                        label="Apply"
                        variant="brand"
                        value={job.Id}
                        onclick={handleApply}>
                    </lightning-button>

                </div>

            </div>

        </div>

    </article>

</template>
