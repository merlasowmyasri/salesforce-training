<template>

    <div class="slds-align_absolute-center slds-p-around_x-large">

        <div class="slds-text-align_center">

            <h2 class="slds-text-heading_medium slds-m-bottom_small">
                {title}
            </h2>

            <p class="slds-text-body_regular slds-m-bottom_medium">
                {message}
            </p>

            <template if:true={showAction}>

                <lightning-button
                    label={actionLabel}
                    variant="brand"
                    onclick={handleAction}>
                </lightning-button>

            </template>

        </div>

    </div>

</template>
