<template>

    <lightning-card title="Student Profile" icon-name="standard:contact">

        <div class="slds-p-around_medium">

            <!-- Loading -->
            <template if:true={isSaving}>

                <div class="slds-is-relative slds-m-bottom_medium">

                    <lightning-spinner
                        alternative-text="Saving profile"
                        size="medium">
                    </lightning-spinner>

                </div>

            </template>


            <!-- Success Message -->
            <template if:true={successMessage}>

                <div
                    class="slds-notify slds-notify_alert slds-alert_success slds-m-bottom_medium"
                    role="alert">

                    {successMessage}

                </div>

            </template>


            <!-- Error Message -->
            <template if:true={errorMessage}>

                <div
                    class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium"
                    role="alert">

                    {errorMessage}

                </div>

            </template>


            <!-- Profile Form -->
            <lightning-record-edit-form
                record-id={recordId}
                object-api-name={objectApiName}
                onsuccess={handleSuccess}
                onerror={handleError}>

                <div class="slds-grid slds-wrap slds-gutters">

                    <!-- Student Name -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">

                        <lightning-input-field
                            field-name="Name"
                            disabled>
                        </lightning-input-field>

                    </div>


                    <!-- Phone -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">

                        <lightning-input-field
                            field-name="Phone__c"
                            required>
                        </lightning-input-field>

                    </div>


                    <!-- Email -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">

                        <lightning-input-field
                            field-name="Email__c"
                            required>
                        </lightning-input-field>

                    </div>


                    <!-- Branch -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">

                        <lightning-input-field
                            field-name="Branch__c"
                            required>
                        </lightning-input-field>

                    </div>


                    <!-- CGPA -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">

                        <lightning-input-field
                            field-name="CGPA__c"
                            required>
                        </lightning-input-field>

                    </div>


                    <!-- Active Backlogs -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">

                        <lightning-input-field
                            field-name="Active_Backlogs__c">
                        </lightning-input-field>

                    </div>


                    <!-- Skills -->
                    <div class="slds-col slds-size_1-of-1">

                        <lightning-input-field
                            field-name="Skills__c">
                        </lightning-input-field>

                    </div>


                    <!-- Preferred Location -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">

                        <lightning-input-field
                            field-name="Preferred_Location__c">
                        </lightning-input-field>

                    </div>

                </div>


                <!-- Save Button -->
                <div class="slds-m-top_medium slds-text-align_center">

                    <lightning-button
                        type="submit"
                        variant="brand"
                        label="Save Profile"
                        disabled={isSaving}>
                    </lightning-button>

                </div>

            </lightning-record-edit-form>

        </div>

    </lightning-card>

</template>
