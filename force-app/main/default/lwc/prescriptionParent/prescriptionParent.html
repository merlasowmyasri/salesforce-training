<template>

    <lightning-card title="Prescription Parent">

        <div class="slds-p-around_medium">

            <lightning-input
                label="Prescription Record Id"
                value={recordId}
                onchange={handleRecordIdChange}>
            </lightning-input>

            <lightning-button
                label="Send Id to Child"
                onclick={handleSendToChild}>
            </lightning-button>

            <div class="slds-m-top_medium">

                <c-prescription-child
                    record-id={recordId}
                    onchildmessage={handleChildMessage}>
                </c-prescription-child>

            </div>

            <template if:true={message}>
                <div class="slds-m-top_medium">
                    <p><strong>Parent received:</strong> {message}</p>
                </div>
            </template>

        </div>

    </lightning-card>

</template>
