<template>

    <div class="page-container">

        <!-- Institute Logo -->
        <div class="logo-section">
            <img src={logoUrl} alt="Vishnu Institute of Technology Logo" />
        </div>

        <!-- Welcome Banner -->
        <div class="welcome-banner">

            <h1>
                Placement Management System
            </h1>

            <h2>
                Welcome to Vishnu Placement Portal
            </h2>

            <p>
                Your Career Starts Here!
            </p>

        </div>

        <!-- Four Cards -->
        <div class="cards-container">

            <!-- Students Card -->
            <div class="dashboard-card">

                <div class="card-icon">
                    👨‍🎓
                </div>

                <h3>
                    Students
                </h3>

                <p class="card-number">
                    {numberOfStudents}
                </p>

                <p>
                    Registered Students
                </p>

            </div>


            <!-- Companies Card -->
            <div class="dashboard-card">

                <div class="card-icon">
                    🏢
                </div>

                <h3>
                    Companies
                </h3>

                <p class="card-number">
                    {numberOfCompanies}
                </p>

                <p>
                    Recruiting Companies
                </p>

            </div>


            <!-- Jobs Card -->
            <div class="dashboard-card">

                <div class="card-icon">
                    💼
                </div>

                <h3>
                    Jobs
                </h3>

                <p class="card-number">
                    {numberOfJobs}
                </p>

                <p>
                    Available Jobs
                </p>

            </div>


            <!-- Applications Card -->
            <div class="dashboard-card">

                <div class="card-icon">
                    📝
                </div>

                <h3>
                    Applications
                </h3>

                <p class="card-number">
                    {applicationsSubmitted}
                </p>

                <p>
                    Applications Submitted
                </p>

            </div>

        </div>


        <!-- Student Welcome -->
        <div class="student-section">

            <h2>
                Welcome, {studentName}!
            </h2>

            <p>
                Roll Number: {rollNumber}
            </p>

            <p>
                Department: {department}
            </p>

        </div>

    </div>

</template>
